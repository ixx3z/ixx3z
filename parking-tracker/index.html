<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parking Spot Availability Tracker — Prototype</title>
<style>
:root{
  --ink:#16222b; --ink2:#4a5863; --mute:#5f6d77; --line:#dfe5e9; --bg:#f3f5f7; --card:#fff;
  --pri:#0e5e6f; --pri2:#0a4855; --priSoft:#e3f1f3;
  --green:#249a52; --yellow:#f3c623; --orange:#ee8a1f; --red:#c83b3b; --grey:#a3adb5; --acc:#1d4ed8;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] svg.ic.flip{transform:scaleX(-1)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-inline-end:auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.roles{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.roles button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--ink2);display:flex;gap:6px;align-items:center}
.roles button small{font-weight:500;color:var(--mute);font-size:12px}
.roles button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.langbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;display:flex;gap:6px;align-items:center;font-weight:600}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;padding:24px;max-width:1500px;margin:0 auto;align-items:start}
.devwrap{display:flex;justify-content:center;min-width:0}
@media (max-width:1050px){.stage{grid-template-columns:1fr}}

/* ---------- phone ---------- */
.phone{width:390px;max-width:100%;height:clamp(640px,calc(100vh - 110px),820px);border-radius:44px;background:#0f1418;padding:12px;box-shadow:0 18px 50px rgba(15,30,40,.25)}
.screen{position:relative;height:100%;border-radius:34px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.appbar{display:flex;align-items:center;gap:10px;padding:18px 16px 10px;background:#fff;border-bottom:1px solid var(--line)}
.appbar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:var(--bg);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--ink2)}
.dot{position:absolute;top:5px;inset-inline-end:5px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.content{flex:1;overflow-y:auto;padding:14px 14px 20px}
.tabbar{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px 14px}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mute);padding:6px 0;border-radius:10px;position:relative;min-height:48px}
.tabbar button.on{color:var(--pri)}
.tabbar .dot{top:2px;inset-inline-end:calc(50% - 20px)}

/* ---------- desktop ---------- */
.desk{width:100%;max-width:1150px;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(15,30,40,.18);overflow:hidden;border:1px solid var(--line)}
.deskbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#e9edf0;border-bottom:1px solid var(--line)}
.deskbar i{width:11px;height:11px;border-radius:50%;background:#c9d0d5;display:block}
.deskbar .url{flex:1;margin-inline-start:10px;background:#fff;border-radius:8px;padding:5px 12px;font-size:13px;color:var(--mute);direction:ltr;text-align:left}
.dapp{display:grid;grid-template-columns:220px 1fr;min-height:720px}
.side{background:#0f2f37;color:#d6e6ea;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side .who{padding:6px 10px 16px;font-size:13px;color:#a9c3ca}
.side .who b{display:block;color:#fff;font-size:15px}
.side button{border:0;background:transparent;color:#d6e6ea;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-weight:600;text-align:start}
.side button.on{background:#1d4b56;color:#fff}
.side .sp{flex:1}
.dmain{padding:22px 26px;overflow:auto;max-height:780px;min-width:0}
.dmain h2{margin:0 0 4px;font-size:21px}
.dmain .sub{color:var(--mute);margin:0 0 18px;font-size:13.5px}

/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.btn{border:0;background:var(--pri);color:#fff;border-radius:12px;padding:11px 14px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:44px;text-decoration:none}
.btn:hover{background:var(--pri2)}
.btn.sec{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.sec:hover{background:var(--priSoft)}
.btn.ghost{background:var(--bg);color:var(--ink2)}
.btn.danger{background:var(--red)}
.btn.small{min-height:34px;padding:6px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.stack{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;min-height:44px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:12px}
.check input{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.pill.g{background:#dcf2e4;color:#16693a}.pill.y{background:#fdf3c9;color:#7a5d00}.pill.o{background:#fde5cc;color:#8a4a00}.pill.r{background:#f8dede;color:#9b2323}
.pill.b{background:#dfe7fd;color:#1d3fa8}.pill.gr{background:#e6e9ec;color:#4a5863}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.sw.green{background:var(--green)}.sw.yellow{background:var(--yellow)}.sw.orange{background:var(--orange)}.sw.red{background:var(--red)}.sw.grey{background:var(--grey)}
.sw.acc{background:#fff;border:2px solid var(--acc)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px;color:var(--ink2);margin:8px 2px 4px}
.legend span{display:flex;gap:6px;align-items:center}
.toast{position:absolute;left:14px;right:14px;top:84px;background:#13262e;color:#fff;padding:12px 14px;border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:40}
.toast.bad{background:#7c2020}
.dtoast{position:fixed;top:auto;bottom:24px;left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:520px;z-index:60}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:600}
.notice{background:var(--priSoft);color:#0b4552;border-radius:12px;padding:10px 12px;font-size:13px}
.notice.warn{background:#fdf0dc;color:#7a4300}
.notice.bad{background:#f8e1e1;color:#8a1f1f}
.notice.ok{background:#dcf2e4;color:#16693a}

/* login */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 22px}
.login .logo{width:56px;height:56px;border-radius:16px;font-size:24px;margin-bottom:14px}
.login h2{margin:0 0 4px;font-size:22px}
.login p{margin:0 0 20px;color:var(--mute);font-size:14px}

/* home choices */
.choice{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;text-align:start;margin-bottom:10px}
.choice:hover{border-color:var(--pri)}
.choice .cico{width:48px;height:48px;border-radius:14px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;flex:none}
.choice .cico svg{width:26px;height:26px}
.choice b{display:block;font-size:15.5px}
.choice span{font-size:13px;color:var(--mute)}
.lotrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:start}
.lotrow:first-of-type{border-top:0}
.bar{height:7px;border-radius:5px;background:#e8ecef;overflow:hidden;width:70px}
.bar i{display:block;height:100%;background:var(--green)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bbtn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:start;font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center;min-height:52px}
.bbtn.on{border-color:var(--pri);background:var(--priSoft);color:var(--pri2)}
.big{font-size:30px;font-weight:800;letter-spacing:.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap;min-height:36px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* map */
svg.map{width:100%;height:auto;display:block;direction:ltr}
.map .bld rect{fill:#c7d3da;stroke:#9fb0ba}
.map .bld text{fill:#2c3e48;font-size:9.5px;font-weight:700;text-anchor:middle;pointer-events:none}
.map .bld.click{cursor:pointer}
.map .bld.click:hover rect{fill:#b5c6cf}
.map .bld.hi rect{fill:var(--pri);stroke:var(--pri2)}
.map .bld.hi text{fill:#fff}
.map .lotbg{fill:#6f7c84}
.map .lotlbl{font-size:10px;font-weight:700;fill:#3d4b54}
.map .sp{stroke:#fff;stroke-width:1;cursor:pointer}
.map .sp:hover{stroke:#111;stroke-width:1.6}
.map .sp.green{fill:var(--green)}.map .sp.yellow{fill:var(--yellow)}.map .sp.orange{fill:var(--orange)}.map .sp.red{fill:var(--red)}.map .sp.grey{fill:var(--grey)}
.map .sp.acc{stroke:var(--acc);stroke-width:2.2}
.map .sp.sel{stroke:#111;stroke-width:2.6}
.map .accico{font-size:7px;fill:#fff;text-anchor:middle;pointer-events:none;font-weight:700}
.map .dim{opacity:.3}
.map .pulse{fill:none;stroke:var(--pri);stroke-width:2.5;animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.4)}}

/* sheet */
.backdrop{position:absolute;inset:0;background:rgba(10,20,26,.45);z-index:30;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px 22px;max-height:85%;overflow-y:auto}
.sheet h3{margin:0 0 4px;font-size:19px}
.grab{width:40px;height:5px;border-radius:3px;background:#d4dbe0;margin:-6px auto 12px}

/* booking */
.cdown{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.statusline{display:flex;gap:8px;align-items:center;margin:4px 0 10px;font-weight:600}

/* tables */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:12.5px;color:var(--mute)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:start;font-size:12px;color:var(--mute);font-weight:700;padding:8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:first-child,.tbl td.ltr,.tbl td .pill{white-space:nowrap}
.tblbox{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:520px}
.tblbox .tbl th{position:sticky;top:0;background:#fff}
.dgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:16px}
@media (max-width:1250px){.dgrid{grid-template-columns:1fr}}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.toolbar .field{margin:0}
.toolbar .check{margin:0 0 10px}
.modalbg{position:fixed;inset:0;background:rgba(10,20,26,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:16px;padding:20px;width:440px;max-width:100%}
.modal h3{margin:0 0 14px}

/* panel */
.panel{display:flex;flex-direction:column;gap:12px}
.panel .card{margin:0}
.panel h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.clock{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.clockday{color:var(--ink2);font-weight:600;margin-bottom:10px}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.uclist{display:flex;flex-direction:column;gap:6px}
.uc{background:var(--priSoft);color:#0b4552;border-radius:10px;padding:7px 10px;font-weight:600;font-size:13px}
.acct{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.acct:first-of-type{border-top:0}
.acct code{font-size:12px;background:var(--bg);padding:2px 6px;border-radius:6px;direction:ltr}
.rules{margin:0;padding-inline-start:18px;font-size:13px;color:var(--ink2)}
.rules li{margin-bottom:4px}
.scen{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.scen:first-of-type{border-top:0}
.ltr{direction:ltr;unicode-bidi:isolate}
</style>
</head>

let lang=(navigator.language||'en').toLowerCase().indexOf('ar')===0?'ar':'en';
try{const l=localStorage.getItem(LS+'-lang');if(l==='ar'||l==='en')lang=l;}catch(e){}
function t(k,p){const e=T[k];let s=e?(lang==='ar'?e[1]:e[0]):k;if(p)s=s.replace(/\{(\w+)\}/g,(m,x)=>p[x]!==undefined?p[x]:m);return s;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const LOC=()=>lang==='ar'?'ar-SA-u-nu-latn-ca-gregory':'en-GB';
const fmtT=ms=>new Date(ms).toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit',hour12:false});
const fmtD=ms=>new Date(ms).toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'short'});

const PROTECT=['A-01','A-02','A-03','A-04','A-05','B-10','C-01','D-12'];
const ENDS=[3,6,12,20,30,45,60,80,100,118];
function addFake(uid,spot,start,end,status,extra){S.res.push(Object.assign({id:'R'+(++S.seq),uid,spot,start,end,ext:0,status,checkIn:status==='active'?start+2*MIN:null,checkOut:null,reminded:true,endNotified:false,fake:true},extra||{}));}
function topUp(n){
  const R=rng(Math.floor(n/MIN)%99991+3);
  const target=Math.round(S.spots.length*0.5);
  let taken=S.spots.filter(sp=>{const k=spotState(sp,n).k;return k==='taken'||k==='manual';}).length;
  const busyU=new Set(S.res.filter(isOpen).map(r=>r.uid));
  const pool=S.users.filter(u=>u.fake&&/^4430002/.test(u.id)&&!busyU.has(u.id));
  const cand=S.spots.filter(sp=>!PROTECT.includes(sp.id)&&spotState(sp,n).k==='free'&&!conflict(sp.id,n,n+RES_LEN));
  for(let i=cand.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]];}
  while(taken<target&&cand.length&&pool.length){
    const sp=cand.pop();const k=pool.findIndex(u=>!sp.acc||u.eligible);if(k<0)continue;
    const u=pool.splice(k,1)[0];const e=n+ENDS[Math.floor(R()*ENDS.length)]*MIN;
    addFake(u.id,sp.id,e-RES_LEN,e,'active');taken++;
  }
}
function ensureScenario(id){
  const n=now(),sp=spotById(id);if(!sp)return;
  const clearSpot=()=>S.res.forEach(r=>{if(r.spot===id&&isOpen(r)&&r.fake){r.status='done';r.checkOut=n;}});
  const freeUser=uid=>S.res.forEach(r=>{if(r.uid===uid&&isOpen(r)){r.status='done';r.checkOut=n;}});
  sp.maint=false;
  if(id==='B-10'&&!S.res.some(r=>r.spot===id&&r.status==='active'&&n>r.end+GRACE)){clearSpot();freeUser('443000101');sp.manualOcc=null;addFake('443000101',id,n-140*MIN,n-25*MIN,'active',{stay:true});}
  if(id==='D-12'&&!S.res.some(r=>r.spot===id&&isOpen(r)&&r.uid==='443000102')){clearSpot();freeUser('443000102');sp.manualOcc=null;addFake('443000102',id,n-6*MIN,n-6*MIN+RES_LEN,'booked',{noAuto:true});}
  if(id==='C-01'){clearSpot();if(!sp.manualOcc)sp.manualOcc={since:n-30*MIN};}
}
function seedOccupancy(n){
  const R=rng(Math.floor(n/MIN)%99991+17);
  const add=addFake;
  // special demo cases for the officer
  add('443000101','B-10',n-140*MIN,n-25*MIN,'active',{stay:true});            // overstay
  add('443000102','D-12',n-6*MIN,n-6*MIN+RES_LEN,'booked',{noAuto:true});     // waiting for check-in (reserved misuse case)
  const c1=spotById('C-01'); if(c1) c1.manualOcc={since:n-30*MIN};             // car in accessible spot, no reservation
  const keepFree=PROTECT.concat(['E-50']);
  const pool=S.users.filter(u=>u.fake&&/^4430002/.test(u.id));
  let pi=0;
  const ends=ENDS;
  S.spots.forEach(sp=>{
    if(keepFree.includes(sp.id)||sp.maint||pi>=pool.length)return;
    const r=R();
    if(r<0.52){const u=pool[pi++];if(sp.acc&&!u.eligible)return;const e=n+ends[Math.floor(R()*ends.length)]*MIN;add(u.id,sp.id,Math.min(n-10*MIN,e-RES_LEN+Math.floor(R()*40)*MIN),e,'active');}
    else if(r<0.6){const u=pool[pi++];if(sp.acc&&!u.eligible)return;const s=n+[25,40,55,80][Math.floor(R()*4)]*MIN;add(u.id,sp.id,s,s+RES_LEN,'booked');}
  });
}

const isOpen=r=>r.status==='booked'||r.status==='active';
function openRes(uid){return S.res.find(r=>r.uid===uid&&isOpen(r));}
function spotState(sp,n){
  n=n||now();
  if(sp.maint)return {k:'maint'};
  const r=S.res.find(x=>x.spot===sp.id&&(x.status==='active'||(x.status==='booked'&&x.start<=n)));
  if(r)return {k:'taken',r,left:r.end-n};
  if(sp.manualOcc)return {k:'manual'};
  return {k:'free',next:nextRes(sp.id,n)};
}
function nextRes(id,n){let best=null;S.res.forEach(r=>{if(r.spot===id&&r.status==='booked'&&r.start>n&&(!best||r.start<best.start))best=r;});return best;}
function color(st){if(st.k==='maint')return 'grey';if(st.k==='free')return 'green';if(st.k==='manual')return 'red';const l=st.left;if(l<0)return 'red';if(l<=5*MIN)return 'yellow';if(l<=HOUR)return 'orange';return 'red';}
function statusText(st){
  if(st.k==='maint')return t('stMaint');if(st.k==='free')return t('stFree');if(st.k==='manual')return t('stManual');
  if(st.left<0)return t('stOver');if(st.left>HOUR)return t('stLong');return t('stFrees',{d:fmtDur(st.left)});
}
const pillCls={green:'g',yellow:'y',orange:'o',red:'r',grey:'gr'};
function conflict(id,s,e,ex){
  const n=now(),sp=spotById(id);
  if(!sp||sp.maint)return true;
  if(sp.manualOcc&&s<n+30*MIN)return true;
  return S.res.some(r=>r.spot===id&&r.id!==ex&&isOpen(r)&&r.start<e&&s<Math.max(r.end,r.status==='active'?n:0)+GRACE);
}
function notify(uid,key,p){const u=user(uid);if(!u||u.fake)return;S.notif.push({id:++S.seq,uid,t:now(),key,p:p||{},read:false});}
function notifText(nf){const p=Object.assign({},nf.p);if(p.from)p.from=fmtT(p.from);if(p.to)p.to=fmtT(p.to);if(p.why)p.why=t(p.why);if(p.type)p.type=t(p.type);return t(nf.key,p);}
function book(uid,spotId,start){
  const u=user(uid),sp=spotById(spotId),n=now();
  if(!sp||sp.maint)return {ok:false,why:'why_unavailable'};
  if(sp.acc&&!u.eligible)return {ok:false,why:'why_notEligible'};
  if(openRes(uid))return {ok:false,why:'why_oneOnly'};
  const s=Math.max(start,n),e=s+RES_LEN;
  if(conflict(spotId,s,e))return {ok:false,why:'why_taken'};
  const r={id:'R'+(++S.seq),uid,spot:spotId,start:s,end:e,ext:0,status:'booked',checkIn:null,checkOut:null,reminded:false,endNotified:false,fake:false,created:n};
  S.res.push(r);notify(uid,'n_confirm',{spot:spotId,from:s,to:e});
  return {ok:true,r};
}
function extendRes(rid){
  const r=S.res.find(x=>x.id===rid),n=now();
  if(!r||!isOpen(r))return false;
  if(n>=r.end){notify(r.uid,'n_extNo',{why:'x_ended'});return false;}
  if(r.ext>=MAX_EXT){notify(r.uid,'n_extNo',{why:'x_max'});return false;}
  if(conflict(r.spot,r.end,r.end+EXT_LEN,r.id)){notify(r.uid,'n_extNo',{why:'x_next'});return false;}
  r.end+=EXT_LEN;r.ext++;r.reminded=false;notify(r.uid,'n_extOk',{to:r.end});return true;
}
function engine(){
  const n=now();let ch=false;
  S.res.forEach(r=>{
    if(r.status==='booked'){
      if(r.fake&&!r.noAuto&&n>=r.start){r.status='active';r.checkIn=n;ch=true;}
      else if(n>r.start+GRACE){r.status='noshow';notify(r.uid,'n_noshow',{spot:r.spot});ch=true;}
    }
    if(r.status==='active'){
      if(!r.reminded&&n>=r.end-REMIND&&n<r.end){r.reminded=true;notify(r.uid,'n_remind',{spot:r.spot,to:r.end,rid:r.id});ch=true;}
      if(n>=r.end){
        if(r.fake&&!r.stay){r.status='done';r.checkOut=r.end;ch=true;}
        else if(!r.endNotified){r.endNotified=true;notify(r.uid,'n_ended',{spot:r.spot});ch=true;}
      }
    }
  });
  if(!S.lastTop)S.lastTop=n;
  if(n-S.lastTop>=5*MIN||n<S.lastTop){topUp(n);S.lastTop=n;ch=true;}
  ['student','officer','admin'].forEach(role=>{const s=S.sessions[role];if(s&&n>s.exp){S.sessions[role]=null;ui[role].expired=true;ch=true;}});
  return ch;
}
function endOfWeek(n){const d=new Date(n);d.setDate(d.getDate()+(6-d.getDay()));d.setHours(23,59,59,999);return d.getTime();}
function phase(r,n){if(r.status==='booked')return n<r.start-EARLY?'w':'o';return n<r.end-REMIND?'a':n<r.end?'r':n<r.end+GRACE?'e':'x';}
function sig(){const n=now();return S.spots.map(sp=>color(spotState(sp,n))[0]).join('')+'|'+S.res.filter(r=>!r.fake&&isOpen(r)).map(r=>r.id+r.status+phase(r,n)).join(',')+'|'+S.notif.length;}

/* verify (US12) */
function verify(spotId,plate){
  const n=now(),sp=spotById(spotId);if(!sp)return null;
  const st=spotState(sp,n);plate=(plate||'').trim().toUpperCase();
  const po=plate?S.users.find(u=>u.plate&&u.plate.toUpperCase()===plate):null;
  const out={spot:sp.id,acc:sp.acc,st,plate,plateOwner:po?po.id:null,sug:'valid',d:0};
  if(st.k==='maint'){out.sug='maint';return out;}
  if(st.k==='free'){out.sug='free';return out;}
  if(st.k==='manual'){
    if(sp.acc&&(!po||!po.eligible))out.sug='acc';else out.sug='noRes';return out;
  }
  const r=st.r;out.res=r.id;out.owner=r.uid;
  if(n>r.end+GRACE){out.sug='overstay';out.d=n-r.end;return out;}
  if(plate&&(!po||po.id!==r.uid)){out.sug=(sp.acc&&(!po||!po.eligible))?'acc':'reserved';return out;}
  if(n>r.end){out.sug='grace';out.d=n-r.end;return out;}
  return out;
}

function nearest(bid,u,inclAcc){
  const b=bld(bid),n=now(),cx=b.x+b.w/2,cy=b.y+b.h/2;let best=null;
  S.spots.forEach(sp=>{
    if(spotState(sp,n).k!=='free')return;
    if(sp.acc&&!(u.eligible&&inclAcc))return;
    if(conflict(sp.id,n,n+RES_LEN))return;
    const g=spotXY(sp),d=Math.hypot(g.x+7-cx,g.y+11-cy);

  });

function resState(r,n){
  n=n||now();
  if(r.status==='booked')return {key:'rs_booked',pill:'y'};
  if(r.status==='active'){if(n<r.end)return {key:'rs_active',pill:'g'};if(n<r.end+GRACE)return {key:'rs_ended',pill:'o'};return {key:'rs_overstay',pill:'r'};}
  return {key:'rs_'+r.status,pill:r.status==='done'?'g':r.status==='noshow'?'r':'gr'};

  oSpot(id){ui.officer.sheet={spot:id};},
  oLot(l){ui.officer.lot=l;},
  oVerifyFrom(id){const o=ui.officer;o.sheet=null;o.screen='verify';o.v={step:'form',spot:id,plate:'',res:null,type:null,done:null};},
  oIn(id){const n=now();const r=S.res.find(x=>x.spot===id&&x.status==='booked'&&x.start-EARLY<=n);
    if(r){r.status='active';r.checkIn=n;r.by='officer';notify(r.uid,'n_mIn',{spot:id});toast('officer',t('m_inDone'));}else toast('officer',t('m_noBooked'),true);},
  oOut(id){const sp=spotById(id),n=now();const r=S.res.find(x=>x.spot===id&&x.status==='active');
    if(r){r.status='done';r.checkOut=n;notify(r.uid,'n_mOut',{spot:id});toast('officer',t('m_outDone'));}
    else if(sp.manualOcc){sp.manualOcc=null;toast('officer',t('m_outDone'));}else toast('officer',t('m_alreadyFree'));},
  oSet(arg){const [id,v]=arg.split('|');const sp=spotById(id);const st=spotState(sp);
    if(st.k==='taken'){toast('officer',v==='free'?t('m_useCheckout'):t('m_hasRes'),true);return;}
    if(v==='occ'){if(!sp.manualOcc)sp.manualOcc={since:now()};}else sp.manualOcc=null;
    if(sp.maint&&v==='free'){/* maintenance is admin-only */}
    toast('officer',t('m_statusDone'));},
  oConfirm(){ui.officer.v.step='type';},
  oBackRes(){ui.officer.v.step='result';},
  oNoViol(){const v=ui.officer.v;v.step='done';v.done={none:true};},
  oReset(){ui.officer.v={step:'form',spot:'',plate:'',res:null,type:null,done:null};},
  scenario(arg){const [sp,pl]=arg.split('|');ensureScenario(sp);ui.role='officer';if(!S.sessions.officer)S.sessions.officer={uid:'SO-1001',exp:endOfWeek(now())};const o=ui.officer;o.sheet=null;o.screen='verify';o.v={step:'form',spot:sp,plate:pl,res:null,type:null,done:null};},
  /* admin */
  aGo(k){ui.admin.screen=k;ui.admin.modal=null;},
  aSpotJump(id){const a=ui.admin;a.screen='spots';a.lot=id.split('-')[0];a.flash=id;a.scrollTo=id;},
  aAcc(id){const sp=spotById(id);sp.acc=!sp.acc;toast('admin',t('spotSaved',{s:id}));},
  aMaint(id){const sp=spotById(id);if(!sp.maint&&S.res.some(r=>r.spot===id&&r.status==='active')){toast('admin',t('cannotDel'),true);return;}sp.maint=!sp.maint;toast('admin',t('spotSaved',{s:id}));},
  aDelSpot(id){ui.admin.modal={type:'delSpot',id};},
  aDelSpotOk(id){if(S.res.some(r=>r.spot===id&&isOpen(r))){ui.admin.modal.err='cannotDel';return;}S.spots=S.spots.filter(s=>s.id!==id);ui.admin.modal=null;toast('admin',t('spotDeleted',{s:id}));},
  aElig(id){const u=user(id);u.eligible=!u.eligible;toast('admin',t('userSaved'));},
  aSusp(id){const u=user(id);u.suspended=!u.suspended;if(u.suspended)['student','officer','admin'].forEach(r=>{if(S.sessions[r]&&S.sessions[r].uid===id&&r!=='admin')S.sessions[r]=null;});toast('admin',t('userSaved'));},
  aUserNew(){ui.admin.modal={type:'user',id:null};},
  aUserEdit(id){ui.admin.modal={type:'user',id};},
  aDelUser(id){ui.admin.modal={type:'delUser',id};},
  aDelUserOk(id){if(openRes(id)){ui.admin.modal.err='userHasRes';return;}if(S.sessions.admin&&S.sessions.admin.uid===id)return;S.users=S.users.filter(u=>u.id!==id);['student','officer'].forEach(r=>{if(S.sessions[r]&&S.sessions[r].uid===id)S.sessions[r]=null;});ui.admin.modal=null;toast('admin',t('userDeleted'));},
  aClose(){ui.admin.modal=null;},
  /* demo */
  time(m){S.offset+=(+m)*MIN;},
  nextWeek(){const n=now();const d=new Date(n);d.setDate(d.getDate()+((7-d.getDay())%7||7));d.setHours(7,30,0,0);
    S.res.forEach(r=>{if(r.status==='active'){r.status='done';r.checkOut=r.end;}else if(r.status==='booked'){r.status=r.fake?'done':'noshow';}});
    S.spots.forEach(sp=>sp.manualOcc=null);
    S.offset+=d.getTime()-n;seedOccupancy(now());},
  reset(){try{localStorage.removeItem(LS);}catch(e){}seed();ui.student=Object.assign(ui.student,{screen:'home',sheet:null,autoB:null,lot:'all',err:null,expired:false});ui.officer=Object.assign(ui.officer,{screen:'map',sheet:null,err:null,expired:false});ui.officer.v={step:'form',spot:'',plate:'',res:null,type:null,done:null};ui.admin=Object.assign(ui.admin,{screen:'dash',modal:null,err:null,expired:false});},
  quick(arg){const [role,id]=arg.split('|');const u=user(id);if(!u)return;if(u.suspended){ui.role=role;ui[role].err='suspended';return;}S.sessions[role]={uid:id,exp:endOfWeek(now())};ui.role=role;ui[role].err=null;ui[role].expired=false;if(role==='student'){ui.student.screen='home';ui.student.sheet=null;}}
};
const F={
  login(f){const role=f.dataset.role;const id=f.uid.value.trim(),pw=f.pw.value;const u=S.users.find(x=>x.id.toLowerCase()===id.toLowerCase()&&x.role===role);
    if(!u||u.pw!==pw){ui[role].err='badLogin';return;}if(u.suspended){ui[role].err='suspended';return;}
    S.sessions[role]={uid:u.id,exp:endOfWeek(now())};ui[role].err=null;ui[role].expired=false;if(role==='student')ui.student.screen='home';},
  verify(f){const o=ui.officer;o.v.spot=f.spot.value;o.v.plate=f.plate.value;if(!o.v.spot)return;o.v.res=verify(o.v.spot,o.v.plate);o.v.step='result';},
  issue(f){const o=ui.officer,R=o.v.res,type=(f.querySelector('input[name=vt]:checked')||{}).value||'v_overstay';
    const plate=f.plate.value.trim().toUpperCase();
    let uid=null;const po=plate?S.users.find(u=>u.plate&&u.plate.toUpperCase()===plate):null;if(po)uid=po.id;
    if(!uid&&type==='v_overstay'&&R.st.k==='taken')uid=R.st.r.uid;
    if(!plate&&!uid){toast('officer',t('needPlate'),true);return;}
    const v={id:++S.seq,type,spot:R.spot,plate:plate||(uid?user(uid).plate:''),uid,by:S.sessions.officer.uid,t:now(),note:f.note.value.trim()};
    S.viol.push(v);if(uid)notify(uid,'n_viol',{type,spot:R.spot});
    if(f.release.checked){const sp=spotById(R.spot);const r=S.res.find(x=>x.spot===R.spot&&x.status==='active');if(r){r.status='done';r.checkOut=now();}if(sp)sp.manualOcc=null;}
    o.v.step='done';o.v.done={type,uid,plate:v.plate};},
  addSpot(f){const lot=f.lot.value;const LL=LOTS.find(l=>l.id===lot);const used=S.spots.filter(s=>s.lot===lot).map(s=>s.slot);let slot=-1;for(let i=0;i<cap(LL);i++)if(!used.includes(i)){slot=i;break;}
    if(slot<0){toast('admin',t('lotFull'),true);return;}const id=lot+'-'+pad(slot+1);S.spots.push({id,lot,slot,acc:f.acc.checked,maint:false,manualOcc:null});
    S.spots.sort((a,b)=>a.lot===b.lot?a.slot-b.slot:a.lot<b.lot?-1:1);ui.admin.lot=lot;ui.admin.flash=id;ui.admin.scrollTo=id;toast('admin',t('spotAdded',{s:id}));},
  user(f){const m=ui.admin.modal;const id=f.fid.value.trim(),name=f.fname.value.trim(),pw=f.pw.value;
    if(!id||!name||!pw){m.err='fillReq';return;}
    if(!m.id&&user(id)){m.err='idTaken';return;}
    const data={pw,role:f.role.value,plate:f.plate.value.trim().toUpperCase(),eligible:f.elig.checked};
    if(m.id){const u=user(m.id);Object.assign(u,data);u.name[lang]=name;}
    else S.users.unshift(Object.assign({id,name:{en:name,ar:name},suspended:false,fake:false},data));
    ui.admin.modal=null;toast('admin',t('userSaved'));}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||!app.contains(el))return;
  if(el.dataset.self&&e.target!==el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  if(el.tagName!=='A')e.preventDefault();
  if(el.hasAttribute('disabled'))return;
  const r=fn(el.dataset.arg,el,e);
  if(r==='nochange')return;
  freshVals=true;engine();save();render();
});
document.addEventListener('submit',e=>{const f=e.target;const fn=F[f.dataset.form];if(!fn)return;e.preventDefault();fn(f);freshVals=true;engine();save();render();});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el)return;
  if(el.dataset.change==='inclAcc')ui.student.inclAcc=el.checked;
  if(el.dataset.change==='aLot'){ui.admin.lot=el.value;ui.admin.flash=null;}
  render();});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(!el)return;
  if(el.dataset.input==='aQ'){ui.admin.q=el.value;const pos=el.selectionStart;render();const n=document.getElementById('uq');if(n){n.focus();n.setSelectionRange(pos,pos);}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(ui.student.sheet||ui.officer.sheet||ui.admin.modal)){ui.student.sheet=null;ui.officer.sheet=null;ui.admin.modal=null;render();}});

/* ================= loop ================= */
let lastSig='',pending=false,freshVals=false;
function busy(){const a=document.activeElement;return a&&app.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);}
load();engine();render();
setInterval(()=>{
  const ch=engine();const sg=sig();
  if(ch||sg!==lastSig||pending){save();if(busy()){pending=true;updateLive();}else{pending=false;render();}}
  else updateLive();
},1000);
})();
</script>
</body>
</html>
